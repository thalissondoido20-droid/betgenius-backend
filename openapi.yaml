openapi: 3.1.0
info:
  title: BetGenius API
  description: API backend for statistical football analysis using API-Football data
  version: 2.0.0
  contact:
    name: BetGenius Team

servers:
  - url: https://betgenius-backend-production.up.railway.app
    description: Production server (Railway)

paths:
  /health:
    get:
      summary: Health check
      description: Verifica o status do servidor
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Servidor está funcionando
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  
  /profiles:
    get:
      summary: Lista profiles disponíveis
      description: Returns list of available analysis profiles
      operationId: listProfiles
      tags:
        - System
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilesResponse'
        '500':
          description: Error loading profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /search-fixtures:
    get:
      summary: Search matches by team name
      description: Search fixtures (matches) for one or two teams using a 2-stage date window. Stage 1 (main): If from/to are not provided, uses default window of -20 to +20 days. Stage 2 (integrity check): If main search returns 0 fixtures AND default window was used, automatically executes a wide search of -60 to +60 days and returns integrity_check with preview. Useful for GPT to identify the correct fixture_id before analysis.
      operationId: searchFixtures
      tags:
        - Fixtures
      parameters:
        - name: team1
          in: query
          required: true
          description: Name of the first team
          schema:
            type: string
          example: Palmeiras
        - name: team2
          in: query
          required: false
          description: Name of the second team (optional - filters direct confrontations between the two teams)
          schema:
            type: string
          example: Flamengo
        - name: from
          in: query
          required: false
          description: Start date of the search (YYYY-MM-DD format). If not provided, uses today-20 days (default window).
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2024-01-01"
        - name: to
          in: query
          required: false
          description: End date of the search (YYYY-MM-DD format). If not provided, uses today+20 days (default window).
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2024-03-31"
        - name: season
          in: query
          required: false
          description: Season (year). If not provided, will be automatically determined by backend: uses year from 'from' if provided, otherwise uses current year. Backend automatically tries base year and year-1 to ensure results.
          schema:
            type: integer
            format: int32
          example: 2024
        - name: league
          in: query
          required: false
          description: League ID (optional). If provided with 'season', filters by specific league and season.
          schema:
            type: integer
            format: int32
          example: 71
      responses:
        '200':
          description: List of fixtures found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFixturesResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /analyze-from-api:
    post:
      summary: Analyzes a match using API-Football data
      description: Fetches complete data from API-Football for a specific fixture_id, analyzes and returns formatted result
      operationId: analyzeFromApi
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeFromApiRequest'
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeFromApiResponse'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fixture não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error processing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: BetGenius API
        version:
          type: string
          example: v2
        timestamp:
          type: string
          format: date-time
          example: "2024-01-07T12:00:00.000Z"
    
    ProfilesResponse:
      type: object
      properties:
        version:
          type: string
          example: v1
        available_profiles:
          type: array
          items:
            type: string
          example: ["technical", "educational", "creator"]
    
    Fixture:
      type: object
      properties:
        fixture_id:
          type: integer
          format: int64
          description: ID único do jogo na API-Football
          example: 123456
        date:
          type: string
          format: date-time
          description: Data e hora do jogo
          example: "2024-01-15T20:00:00+00:00"
        status:
          type: string
          description: Status do jogo (short)
          example: "NS"
        league:
          type: object
          properties:
            id:
              type: integer
              format: int32
              example: 71
            name:
              type: string
              example: "Brasileirão"
            season:
              type: integer
              format: int32
              example: 2024
        teams:
          type: object
          properties:
            home:
              $ref: '#/components/schemas/Team'
            away:
              $ref: '#/components/schemas/Team'
        score:
          type: object
          nullable: true
          description: Placar do jogo (se já foi realizado)
          properties:
            home:
              type: integer
              nullable: true
              example: 2
            away:
              type: integer
              nullable: true
              example: 1
        venue:
          type: string
          nullable: true
          description: Nome do estádio
          example: "Allianz Parque"
    
    League:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 71
        name:
          type: string
          example: "Brasileirão"
        country:
          type: string
          example: "Brazil"
        round:
          type: string
          nullable: true
          example: "Regular Season - 10"
    
    Team:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 121
        name:
          type: string
          example: "Palmeiras"
        logo:
          type: string
          format: uri
          nullable: true
          example: "https://media.api-sports.io/football/teams/121.png"
    
    SearchFixturesResponse:
      type: object
      properties:
        team_searched:
          type: string
          example: "Palmeiras"
        team_id:
          type: integer
          format: int32
          nullable: true
          example: 121
        team2_filter:
          type: string
          nullable: true
          example: "Flamengo"
        date_range:
          type: object
          description: Janela de datas usada na busca principal
          properties:
            from:
              type: string
              format: date
              example: "2024-01-01"
            to:
              type: string
              format: date
              example: "2024-03-31"
        season_used:
          type: integer
          format: int32
          nullable: true
          description: Season (ano) que foi usada com sucesso na busca. Determinado automaticamente pelo backend (ano de 'from' ou ano atual) e pode tentar ano-1 automaticamente.
          example: 2024
        total_found:
          type: integer
          format: int32
          description: Quantidade de jogos encontrados na busca principal
          example: 5
        fixtures:
          type: array
          description: Fixtures encontrados na busca principal (ordenados por data, mais próximo primeiro)
          items:
            $ref: '#/components/schemas/Fixture'
        integrity_check:
          type: object
          description: Verificação de integridade executada quando busca principal retorna 0
          properties:
            ran:
              type: boolean
              description: Se a verificação foi executada (true se busca principal = 0 e janela padrão usada)
              example: true
            from:
              type: string
              format: date
              nullable: true
              description: Data inicial da janela ampla (-60 dias)
              example: "2023-12-01"
            to:
              type: string
              format: date
              nullable: true
              description: Data final da janela ampla (+60 dias)
              example: "2024-04-01"
            found_in_wider_window:
              type: boolean
              description: Se foram encontrados jogos na janela ampla
              example: true
            wide_total_found:
              type: integer
              format: int32
              description: Quantidade de jogos encontrados na janela ampla
              example: 12
            wide_fixtures_preview:
              type: array
              nullable: true
              description: Preview de até 3 fixtures da janela ampla (apenas se found_in_wider_window=true)
              items:
                $ref: '#/components/schemas/Fixture'
        error:
          type: string
          nullable: true
          description: Error code (if any)
          example: "TEAM_NOT_FOUND"
        message:
          type: string
          nullable: true
          description: Error message (if any)
    
    AnalyzeFromApiRequest:
      type: object
      required:
        - fixture_id
      properties:
        fixture_id:
          type: integer
          format: int64
          description: Match ID obtained via /search-fixtures
          example: 123456
        question:
          type: string
          description: User question (optional)
          example: ""
        profile:
          type: string
          enum: [technical, educational, creator]
          description: Desired analysis profile
          default: technical
          example: technical
        mode:
          type: string
          enum: [pre_game, post_game, round_analysis]
          description: Modo de análise
          default: pre_game
          example: pre_game
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          description: Depth level (1=beginner, 2=intermediate, 3=advanced)
          default: 1
          example: 1
        save_to_db:
          type: boolean
          description: Save analysis to MongoDB
          default: true
          example: true
    
    AnalyzeFromApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        mode:
          type: string
          example: analysis
        profile:
          type: string
          example: technical
        match:
          type: object
          properties:
            fixture_id:
              type: integer
              format: int64
            home_team:
              type: string
            away_team:
              type: string
            league:
              type: string
            date:
              type: string
              format: date-time
              nullable: true
        ux:
          type: object
          description: Formatted response according to selected profile
        analysis:
          type: object
          description: Complete analysis with probabilities and convergences
          properties:
            meta:
              type: object
            outcome_probabilities:
              type: object
            convergences:
              type: array
            pre_game_blocks:
              type: object
        data_summary:
          type: object
          properties:
            has_statistics:
              type: boolean
            has_h2h:
              type: boolean
            has_lineups:
              type: boolean
            has_standings:
              type: boolean
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: FIXTURE_ID_REQUIRED
        message:
          type: string
          description: Descriptive error message
          example: "O campo fixture_id é obrigatório"
        details:
          type: string
          nullable: true
          description: Additional error details
        example:
          type: object
          nullable: true
          description: Exemplo de uso correto (quando aplicável)
